<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111216" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Put shuffled scans back in order. Find missing pages. Nothing leaves your device."
    />
    <title>Scan Sorter - put shuffled scans back in order</title>
    <script>
      // Apply a saved theme before first paint to avoid a flash. Storage may be blocked.
      try {
        var t = localStorage.getItem('scan-sorter-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Scan Sorter needs JavaScript to read and sort your pages on your device.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
